# powerpc64le, see lib_test/cross/gen.sh
cc_target=powerpc64le-linux-gnu
qemu=qemu-ppc64le
qemu_cpu=power9
mc_triple=powerpc64le
mode=ppc64le
cc_flags="-mabi=elfv2 -mno-altivec"
mc_flags=-mcpu=pwr9
arch=ppc
helpers=Powerpc_tests_helpers
declare -A sets=(
  [bit]="0 1"
  [count]="0 1 7 8 15 16 31 32 33 63 64 127"
  [ctr]="0 1 2 0x100000001"
  [lr]="0x20400 0x20403"
  [dds]="0 1 0x7f 0xffffffffffffffff 0xffffffffffffff80"
  [dd]="0 0x8000000000000000 0x7fffffffffffffff 0x123456789abcdef0 0xfedcba9876543210"
  [sel]="0x0001020304050607 0x3f3e3d3c3b3a3938 0x4000ff0810203038 0x0706050403020100"
)
kind() { case $1 in CR[0-7]*|SO|OV|CA|OV32|CA32) echo bit ;; CTR) echo ctr ;; *) echo gpr ;; esac; }
gpr="0 1 0x7f 0x80 0x7fffffff 0x80000000 0xffffffff 0xffffffff80000000 0x7fffffffffffffff 0x8000000000000000 0xffffffffffffffff 0x123456789abcdef0 0xfedcba9876543210"
gpr2="0 1 0x80 0x7fffffff 0xffffffff80000000 0xffffffffffffffff 0x8000000000000000 0x123456789abcdef0"

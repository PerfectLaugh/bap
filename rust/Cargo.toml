[workspace]
members = [
    "ogre",
    "benchmarks",
    "bap-sexp",
    "bap-bitvec",
    "bap-bir",
    "bap-cfg",
    "bap-bitvec-ocaml",
    "bap-ocaml",
    "bap-knowledge",
    "bap-knowledge-ocaml",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/BinaryAnalysisPlatform/bap"

[workspace.dependencies]
ocaml = { version = "1.3.0", default-features = false, features = ["derive", "boxroot", "bigarray-ext"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive", "rc"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

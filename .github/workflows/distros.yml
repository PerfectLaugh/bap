# builds BAP from source on the supported distributions
name: distros
run-name: Building ${{ github.ref }} on Linux distributions

on:
  schedule:
    - cron: "0 0 * * MON"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu/noble
          - debian/testing
          - fedora
          - archlinux
          - alpine

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build on ${{ matrix.distro }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.distro }}/Dockerfile
          push: false

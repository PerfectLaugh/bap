# builds the binary packages of the development version, the packages
# need an installation of BAP, so they are built with opam, as dune
# doesn't install packages built with dune package management
name: release

on:
  schedule:
    - cron: "0 0 * * SAT" # every Saturday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OPAMJOBS: 2
      OPAMRETRIES: 8
      VERSION: 2.6.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.5.1+options,ocaml-option-flambda
          dune-cache: true

      - name: Add the testing Repository
        run: opam repo add bap git+https://github.com/BinaryAnalysisPlatform/opam-repository#testing

      - name: Build deb packages
        run: ./tools/release.sh ${{ env.VERSION }}

      - name: Move the development tag to this commit
        run: |
          git tag -f "v$VERSION-alpha"
          git push --force origin "refs/tags/v$VERSION-alpha"

      - name: Publish the development prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}-alpha
          name: Development Build
          prerelease: true
          overwrite_files: true
          files: bap/*

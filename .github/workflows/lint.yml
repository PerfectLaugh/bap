name: lint
run-name: Linting ${{ github.ref }}

on:
  - pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DUNE_VERSION: 3.24.2

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dune
        uses: ocaml-dune/setup-dune@v2
        with:
          version: ${{ env.DUNE_VERSION }}
          steps: install-dune enable-pkg

      # the ocamlformat version is taken from .ocamlformat
      - name: Check the formatting
        run: dune build @fmt

# builds and tests all packages with dune package management
name: ci
run-name: Testing ${{ github.ref }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DUNE_VERSION: 3.24.2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      # BAP builds LLVM from its sources with CMake
      - name: Install CMake and Ninja
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build

      - name: Build and test BAP
        uses: ocaml-dune/setup-dune@v2
        with:
          version: ${{ env.DUNE_VERSION }}
          steps: install-dune enable-pkg install-depexts build-deps build runtest

      - name: Run functional tests
        run: dune build @testsuite
        env:
          BAP_TESTSUITE_WORK: ${{ github.workspace }}/testsuite-results

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: bap-log
          path: ~/.local/state/bap

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: functional-tests-log
          path: |
            testsuite-results

  # builds all packages on Windows with opam and its mingw-w64 toolchain, as
  # dune has no binary for Windows and its package management doesn't build
  # the OCaml compiler there yet, so the dependencies come from opam, with
  # the packages of opam-overlay, and dune builds BAP with --pkg=disabled
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5

      # BAP builds LLVM from its sources with CMake and Ninja
      - name: Install Ninja
        run: choco install -y ninja

      - name: Install the dependencies
        run: |
          opam repo add bap-overlay ./opam-overlay --this-switch --rank=1
          opam install . --deps-only -y

      - name: Build BAP
        run: opam exec -- dune build --pkg=disabled

      - name: Run unit tests
        run: opam exec -- dune runtest --pkg=disabled

      - name: Run functional tests
        run: opam exec -- dune build --pkg=disabled @testsuite
        env:
          BAP_TESTSUITE_WORK: ${{ github.workspace }}/testsuite-results

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: functional-tests-log-windows
          path: |
            testsuite-results
            _build/log

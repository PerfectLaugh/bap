# builds and tests BAP with the dune nightly and the latest versions of
# the dependencies, to catch upstream breakages early
name: nightly
run-name: Running nightly tests on ${{ github.sha }}

on:
  schedule:
    - cron: "0 6 * * *" # Every day at 06:00 UTC, 2 am EDT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install LLVM and DejaGnu
        run: |
          sudo apt-get update -y
          sudo apt-get install -y llvm-dev dejagnu

      - name: Install dune
        uses: ocaml-dune/setup-dune@v2
        with:
          version: nightly
          cache-prefix: nightly
          steps: install-dune enable-pkg

      - name: Update the dependencies
        run: dune pkg lock

      - name: Install the system dependencies
        run: sudo apt-get install -y $(dune show depexts)

      - name: Build BAP
        run: dune build

      - name: Run unit tests
        run: dune runtest

      - name: Run functional tests
        run: dune exec -- make check

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: bap-log-nightly
          path: ~/.local/state/bap

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: functional-tests-log-nightly
          path: |
            testsuite/*.log
            testsuite/logs
            _build/log
